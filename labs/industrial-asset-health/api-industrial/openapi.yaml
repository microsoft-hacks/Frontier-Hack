openapi: 3.0.3
info:
  title: Northline Motion Works Asset Condition API
  description: Returns current readings, entity-specific thresholds, violations, and
    reported status for one Riverbend Electrification Plant drive.
  version: 1.0.0
servers:
- url: /
  description: Replace with the facilitator-confirmed API base URL
paths:
  /assets/{asset_id}/condition:
    get:
      summary: Get one asset's condition
      description: Use this operation whenever an asset ID such as DRIVE-103 must
        be classified. It returns all four readings, that asset's thresholds, violations,
        and known issues.
      operationId: get_asset_condition
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          description: Stable asset ID from DRIVE-101 through DRIVE-105
          title: Asset Id
        description: Stable asset ID from DRIVE-101 through DRIVE-105
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCondition'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AssetCondition:
      properties:
        asset_id:
          type: string
          title: Asset Id
        name:
          type: string
          title: Name
        reported_status:
          $ref: '#/components/schemas/AssetStatus'
        metrics:
          additionalProperties:
            $ref: '#/components/schemas/MetricCondition'
          type: object
          title: Metrics
        violations:
          items:
            type: string
          type: array
          title: Violations
        issues:
          items:
            type: string
          type: array
          title: Issues
      type: object
      required:
      - asset_id
      - name
      - reported_status
      - metrics
      - violations
      - issues
      title: AssetCondition
    AssetStatus:
      type: string
      enum:
      - normal
      - warning
      - critical
      title: AssetStatus
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Human-readable error message.
      type: object
      required:
      - detail
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MetricCondition:
      properties:
        value:
          type: number
          title: Value
        unit:
          type: string
          title: Unit
        min:
          type: number
          title: Min
        max:
          type: number
          title: Max
        in_range:
          type: boolean
          title: In Range
      type: object
      required:
      - value
      - unit
      - min
      - max
      - in_range
      title: MetricCondition
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
