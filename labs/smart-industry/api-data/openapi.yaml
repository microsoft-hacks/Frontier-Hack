openapi: 3.0.3
info:
  title: API de Máquinas Industriais — Smart Industry
  description: Retorna telemetria atual, parâmetros operacionais, status, motivos
    e alertas das máquinas da Unidade Industrial SP.
  version: 1.1.0
servers:
- url: /
  description: Substitua pela URL base da API confirmada pelo facilitador
paths:
  /plant/status:
    get:
      summary: Obtém o resumo da planta
      description: Retorna o resumo de máquinas por status (online, alert, offline),
        os IDs em alerta e offline e as unidades de cada campo.
      operationId: get_plant_status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantStatus'
  /machines:
    get:
      summary: Lista as máquinas
      description: Retorna a telemetria, os parâmetros, o status, os motivos e os
        alertas de todas as máquinas. Use os filtros opcionais status e type para
        restringir o resultado.
      operationId: list_machines
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MachineStatus'
          - type: 'null'
          description: 'Filtra por status: online, alert ou offline.'
          title: Status
        description: 'Filtra por status: online, alert ou offline.'
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filtra por tipo: cnc, robot, conveyor, forklift, injector,
            press ou welder.'
          title: Type
        description: 'Filtra por tipo: cnc, robot, conveyor, forklift, injector, press
          ou welder.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /machines/{machine_id}:
    get:
      summary: Obtém uma máquina
      description: Use esta operação sempre que um ID de máquina como CNC-003 precisar
        ser analisado. Ela retorna telemetria, parâmetros com limites, status, motivos
        e alertas.
      operationId: get_machine
      parameters:
      - name: machine_id
        in: path
        required: true
        schema:
          type: string
          description: ID da máquina (por exemplo CNC-003, ROB-003, CVY-003, INJ-002)
          title: Machine Id
        description: ID da máquina (por exemplo CNC-003, ROB-003, CVY-003, INJ-002)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '404':
          description: Máquina não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Alert:
      properties:
        metric:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric
          description: Métrica em alerta (temp ou vib). Ausente em perda de comunicação.
        kind:
          anyOf:
          - type: string
          - type: 'null'
          title: Kind
          description: Tipo do alerta quando não é de métrica, por exemplo communication_lost.
        level:
          $ref: '#/components/schemas/AlertLevel'
          description: 'Severidade do alerta: warn, critical ou offline.'
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
          description: Valor medido que violou o limite.
        limit:
          anyOf:
          - type: number
          - type: 'null'
          title: Limit
          description: Limite excedido.
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
          description: Unidade do valor e do limite.
        initialSimulatedSilenceMinutes:
          anyOf:
          - type: number
          - type: 'null'
          title: Initialsimulatedsilenceminutes
          description: Minutos simulados sem comunicação no cadastro inicial (perda
            de comunicação).
      type: object
      required:
      - level
      title: Alert
    AlertLevel:
      type: string
      enum:
      - warn
      - critical
      - offline
      title: AlertLevel
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Human-readable error message.
      type: object
      required:
      - detail
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Machine:
      properties:
        id:
          type: string
          title: Id
          description: ID da máquina, por exemplo CNC-003.
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
          description: 'Tipo da máquina: cnc, robot, conveyor, forklift, injector,
            press ou welder.'
        typeLabel:
          type: string
          title: Typelabel
        status:
          $ref: '#/components/schemas/MachineStatus'
          description: 'Status da máquina: online, alert ou offline.'
        statusLabel:
          type: string
          title: Statuslabel
        commLost:
          type: boolean
          title: Commlost
          description: Verdadeiro quando a comunicação com a máquina foi perdida.
        telemetryQuality:
          type: string
          title: Telemetryquality
          description: Qualidade da telemetria, por exemplo simulated_reference.
        telemetry:
          $ref: '#/components/schemas/Telemetry'
        params:
          $ref: '#/components/schemas/Params'
        reasons:
          items:
            type: string
          type: array
          title: Reasons
          description: Motivos legíveis do status atual; vazio quando online.
        alerts:
          items:
            $ref: '#/components/schemas/Alert'
          type: array
          title: Alerts
          description: Alertas estruturados; vazio quando online.
      type: object
      required:
      - id
      - name
      - type
      - typeLabel
      - status
      - statusLabel
      - commLost
      - telemetryQuality
      - telemetry
      - params
      - reasons
      - alerts
      title: Machine
    MachineList:
      properties:
        company:
          type: string
          title: Company
        plant:
          type: string
          title: Plant
        timestamp:
          type: string
          title: Timestamp
        count:
          type: integer
          title: Count
        machines:
          items:
            $ref: '#/components/schemas/Machine'
          type: array
          title: Machines
      type: object
      required:
      - company
      - plant
      - timestamp
      - count
      - machines
      title: MachineList
    MachineStatus:
      type: string
      enum:
      - online
      - alert
      - offline
      title: MachineStatus
    Params:
      properties:
        mode:
          type: string
          title: Mode
          description: 'Modo de operação: auto, paused ou off.'
        modeLabel:
          type: string
          title: Modelabel
          description: Rótulo legível do modo de operação.
        speed:
          type: number
          title: Speed
          description: Velocidade configurada em %.
        targetTemp:
          type: number
          title: Targettemp
          description: Temperatura alvo em °C.
        tempLimit:
          type: number
          title: Templimit
          description: Limite de temperatura em °C.
        vibLimit:
          type: number
          title: Viblimit
          description: Limite de vibração em mm/s.
        cycleTime:
          type: number
          title: Cycletime
          description: Tempo de ciclo em segundos.
      type: object
      required:
      - mode
      - modeLabel
      - speed
      - targetTemp
      - tempLimit
      - vibLimit
      - cycleTime
      title: Params
    PlantStatus:
      properties:
        company:
          type: string
          title: Company
        plant:
          type: string
          title: Plant
        timestamp:
          type: string
          title: Timestamp
        units:
          additionalProperties:
            type: string
          type: object
          title: Units
          description: 'Unidade de cada campo, por exemplo telemetry.temp: °C.'
        summary:
          $ref: '#/components/schemas/Summary'
      type: object
      required:
      - company
      - plant
      - timestamp
      - units
      - summary
      title: PlantStatus
    Summary:
      properties:
        total:
          type: integer
          title: Total
        online:
          type: integer
          title: Online
        alert:
          type: integer
          title: Alert
        offline:
          type: integer
          title: Offline
        machinesWithCriticalTemperature:
          type: integer
          title: Machineswithcriticaltemperature
        alertMachineIds:
          items:
            type: string
          type: array
          title: Alertmachineids
        offlineMachineIds:
          items:
            type: string
          type: array
          title: Offlinemachineids
      type: object
      required:
      - total
      - online
      - alert
      - offline
      - machinesWithCriticalTemperature
      - alertMachineIds
      - offlineMachineIds
      title: Summary
    Telemetry:
      properties:
        temp:
          type: number
          title: Temp
          description: Temperatura atual em °C.
        vib:
          type: number
          title: Vib
          description: Vibração atual em mm/s.
        usage:
          type: number
          title: Usage
          description: Taxa de utilização atual em %.
      type: object
      required:
      - temp
      - vib
      - usage
      title: Telemetry
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
